name: Build T225 KernelSU-Next kernel

on:
  workflow_dispatch:
    inputs:
      ksu_ref:
        description: "legacy | legacy-susfs | legacy-susfs-nomount | legacy-susfs-manual | legacy-susfs-nomount-manual | susfs-*"
        default: "legacy-susfs-manual"
      manager_source:
        description: "Manager to fetch when manager_apk_url is empty: kowsu (default) = latest KowSU manager | ksun = latest KernelSU-Next (KSUN) spoofed manager"
        default: "kowsu"
      manager_apk_url:
        description: "Direct link to the Manager .apk (optional; empty = automatic, see manager_source)"
        default: ""
      bundle_apk:
        description: "true = also put the Manager .apk inside the flashable zip (bigger zip). false (default) = not bundled; the APK is still used at build time for the signature and version"
        default: "false"
      toolchain:
        description: "crdroid11 = original working clang 11.0.1 (default, safe) | neutron = latest Neutron Clang | zyc = latest ZyC Clang | slim = latest Slim LLVM (kernel.org) | llvm = upstream LLVM (see llvm_url)  [all except crdroid11 are experimental]"
        default: "crdroid11"
      zyc_version:
        description: "For toolchain=zyc only: ZyC Clang version to use, e.g. 14.0.6 (default) | 15.0.7 | 16.0.6 | latest (= newest, currently 23.0.0git)"
        default: "14.0.6"
      llvm_url:
        description: "For neutron/zyc/slim/llvm only. Direct link to a Linux x86_64 .tar.xz / .tar.zst / .tar.gz (empty = auto: newest release of the chosen toolchain; llvm = LLVM 23.1.1 official)"
        default: ""
      features:
        description: "Extra kernel features (space separated): bbr | bbrdef | perf | wireguard | nohuc | quietpod | lean | lean2 | nosec | none  (bbr = BBR+FQ+FQ_CODEL available; bbrdef = also default cc/qdisc; perf = -O2 + BLK_WBT; nohuc = HARDENED_USERCOPY off, Wi-Fi/BT safe)"
        default: "bbr bbrdef perf nohuc quietpod"

      fetch_modules:
        description: "true = also download the latest Play Integrity Fix + TrickyStore module zips and attach them to the release (install them from the KernelSU Manager; TrickyStore needs your own keybox.xml)"
        default: "true"

      send_telegram:
        description: "true (default) = send the finished zip + info to Telegram (needs secrets TG_BOT_TOKEN and TG_CHAT_ID). false = skip"
        default: "true"

      boot_spoof_module:
        description: "true (default) = also build a small KernelSU module (T225-BootSpoof.zip) that reports bootloader locked / verified boot green. Attached to the release. false = skip"
        default: "true"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      WORK: ${{ github.workspace }}/_work
      OUTDIR: ${{ github.workspace }}/_out
      GH_TOKEN: ${{ github.token }}
      KSU_REF: ${{ inputs.ksu_ref }}
      APK_URL: ${{ inputs.manager_apk_url }}
      MANAGER_SOURCE: ${{ inputs.manager_source }}
      FEATURES: ${{ inputs.features }}
      TOOLCHAIN: ${{ inputs.toolchain }}
      BUNDLE_APK: ${{ inputs.bundle_apk }}
      LLVM_URL: ${{ inputs.llvm_url }}
      ZYC_VERSION: ${{ inputs.zyc_version }}
      FETCH_MODULES: ${{ inputs.fetch_modules }}
    steps:
      - uses: actions/checkout@v4

      - name: Remember build start time
        run: echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Download kernel source and build files (Release src-v1)
        run: |
          gh release download src-v1 -R "$GITHUB_REPOSITORY" -p kernel_src.tar.gz -p T225_GitHub_Repo_Files.zip
          unzip -oq T225_GitHub_Repo_Files.zip -x '.github/*'

      # Experimental: other clang instead of the crDroid clang 11.0.1.
      # It is unpacked to $WORK/toolchain_611, so 01_setup.sh skips its own git clone and
      # 02_build.sh picks it up unchanged. Extra -Wno flags are added because a new clang is
      # much stricter than clang 11 on this old 4.19 vendor code. Default (crdroid11) is untouched.
      - name: Install experimental toolchain (neutron | zyc | slim | llvm)
        if: inputs.toolchain != 'crdroid11'
        run: |
          URL="$LLVM_URL"
          if [ -z "$URL" ]; then
            case "$TOOLCHAIN" in
              neutron)
                # newest Neutron Clang build (asset neutron-clang-<date>.tar.zst)
                URL=$(gh api repos/Neutron-Toolchains/clang-build-catalogue/releases/latest \
                  --jq '[.assets[] | select(.name | test("^neutron-clang-.*\\.tar\\.zst$"))][0].browser_download_url // empty') ;;
              zyc)
                # ZyC Clang release (asset Clang-<ver>-<date>.tar.gz). ZYC_VERSION (default 14.0.6)
                # picks the newest release of that version (tag 14.0.6-<date>-release);
                # ZYC_VERSION=latest = newest release of any version (currently 23.0.0git).
                if [ "$ZYC_VERSION" = "latest" ]; then
                  URL=$(gh api repos/ZyCromerZ/Clang/releases/latest \
                    --jq '[.assets[] | select(.name | test("\\.tar\\.(gz|xz|zst)$"))][0].browser_download_url // empty')
                else
                  URL=$(gh api --paginate "repos/ZyCromerZ/Clang/releases?per_page=100" \
                    --jq '.[] | select(.tag_name | startswith("'"$ZYC_VERSION"'-")) | .assets[] | select(.name | test("\\.tar\\.(gz|xz|zst)$")) | .browser_download_url' | head -n 1 || true)
                fi ;;
              slim)
                # newest stable (non -rc) Slim LLVM from kernel.org
                BASE="https://mirrors.edge.kernel.org/pub/tools/llvm/files"
                F=$(curl -fsSL --retry 3 "$BASE/" | grep -oE 'llvm-[0-9]+\.[0-9]+\.[0-9]+-x86_64\.tar\.xz' | sort -uV | tail -1)
                [ -n "$F" ] && URL="$BASE/$F" ;;
              *)
                URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.1/LLVM-23.1.1-Linux-X64.tar.xz" ;;
            esac
            [ -z "$URL" ] && { echo "::error::could not resolve the $TOOLCHAIN toolchain download"; exit 1; }
          fi
          echo "Toolchain ($TOOLCHAIN): $URL"
          sudo apt-get install -y zstd >/dev/null 2>&1 || true
          mkdir -p _llvm "$WORK"
          curl -fL --retry 3 -o _llvm/tc.archive "$URL"
          case "$URL" in
            *.zst) tar -C _llvm --zstd -xf _llvm/tc.archive ;;
            *.gz)  tar -C _llvm -xzf _llvm/tc.archive ;;
            *)     tar -C _llvm -xf _llvm/tc.archive ;;
          esac
          rm -f _llvm/tc.archive
          # bin/clang is a symlink (-> clang-23) in the official tarball, so accept files AND symlinks
          CLANG=$(find _llvm \( -type f -o -type l \) -path '*/bin/clang' | head -1)
          if [ -z "$CLANG" ]; then
            echo "::error::bin/clang not found in the archive. Top-level content:"
            ls -la _llvm | head -20
            exit 1
          fi
          rm -rf "$WORK/toolchain_611"
          mv "$(dirname "$(dirname "$CLANG")")" "$WORK/toolchain_611"
          rm -rf _llvm
          "$WORK/toolchain_611/bin/clang" --version | head -1
          python3 - <<'PY'
          p = "scripts/02_build.sh"
          s = open(p).read()
          flags = ('KCFLAGS="-w -Wno-error -Wno-implicit-function-declaration -Wno-int-conversion '
                   '-Wno-incompatible-function-pointer-types -Wno-implicit-int '
                   '-Wno-deprecated-non-prototype -Wno-strict-prototypes"')
          assert "KCFLAGS=-w" in s
          open(p, "w").write(s.replace("KCFLAGS=-w", flags, 1))
          PY
          grep -n "KCFLAGS" scripts/02_build.sh

      # Manager APK: the given link, or (default) the newest KowSU CI build.
      # KowSU CI builds are only posted to Telegram (@kowsu_build), which a workflow cannot read.
      # JiuGeFaCai/ReSukiSU_CI mirrors every one of them as a GitHub release (tag KowSU_<run id>,
      # title "KowSU v3.3.0-165-g44758e19_32766"), so the newest one is taken from there.
      # If that fails it falls back to the newest *spoofed* KernelSU-Next APK (with a warning).
      # The driver is NOT affected: it always comes from KSU_REF. The APK's signing cert is
      # added to the driver's accepted managers (KSU_EXTRA_CERTS) so a newer Manager is accepted.
      - name: Fetch Manager APK (latest KowSU unless a link is given)
        run: |
          mkdir -p _apk
          URL="$APK_URL"; REL_NAME=""
          SRC_M=$(echo "$MANAGER_SOURCE" | tr 'A-Z' 'a-z' | tr -d ' ')
          case "$SRC_M" in kowsu|ksun) ;; *) echo "::error::manager_source must be 'kowsu' or 'ksun' (got '$MANAGER_SOURCE')"; exit 1 ;; esac
          if [ -z "$URL" ] && [ "$SRC_M" = "kowsu" ]; then
            ROW=$(gh api "repos/JiuGeFaCai/ReSukiSU_CI/releases?per_page=100" \
              --jq '[.[] | select(.tag_name | startswith("KowSU_")) | select(any(.assets[]; .name | test("\\.apk$")))]
                    | sort_by(.published_at) | reverse | .[0] // empty
                    | [.name, ([.assets[] | select(.name | test("\\.apk$"))][0].browser_download_url)] | @tsv' || true)
            REL_NAME=$(printf '%s' "$ROW" | cut -f1)
            URL=$(printf '%s' "$ROW" | cut -f2)
            [ -z "$URL" ] && { echo "::error::manager_source=kowsu but no KowSU APK found on the mirror (use manager_apk_url or manager_source=ksun)"; exit 1; }
            echo "Latest KowSU release: $REL_NAME"
          elif [ -z "$URL" ]; then
            URL=$(gh api "repos/KernelSU-Next/KernelSU-Next/releases?per_page=10" \
              --jq '[.[].assets[] | select(.name | test("spoofed.*release\\.apk$"))][0].browser_download_url // empty' || true)
            [ -z "$URL" ] && { echo "::error::manager_source=ksun but no spoofed KernelSU-Next APK found"; exit 1; }
          fi
          if [ -n "$URL" ] && curl -fsSL --retry 3 -o _apk/manager.apk "$URL" && [ -s _apk/manager.apk ]; then
            echo "Manager APK: $URL"
            CERT=$(python3 -I scripts/apk_cert_info.py --extra _apk/manager.apk)
            echo "Manager cert: $CERT"
            echo "KSU_EXTRA_CERTS=$CERT" >> "$GITHUB_ENV"
            # Driver reports the same version as the Manager (e.g. v3.3.0 / 32766) instead of the
            # branch's own tag/commit count. Read from the APK file name (or the KowSU release title).
            NAME=$(basename "${URL%%\?*}")
            echo "MANAGER_NAME=$NAME" >> "$GITHUB_ENV"
            # keep a copy with its original name; it is attached to the release below
            mkdir -p _mods && cp _apk/manager.apk "_mods/$NAME"
            RX1='_v([0-9]+\.[0-9]+\.[0-9]+)[^_]*_([0-9]+)-release\.apk$'
            RX2=' v([0-9]+\.[0-9]+\.[0-9]+)[^_ ]*_([0-9]+)$'
            if [[ "$NAME" =~ $RX1 ]] || [[ "$REL_NAME" =~ $RX2 ]]; then
              echo "KSU_VERSION_TAG_OVERRIDE=v${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
              echo "KSU_VERSION_OVERRIDE=${BASH_REMATCH[2]}" >> "$GITHUB_ENV"
              echo "Driver version will be pinned to v${BASH_REMATCH[1]} (${BASH_REMATCH[2]})"
            else
              echo "::warning::Could not read version from APK name '$NAME'; driver keeps its own version"
            fi
          else
            rm -f _apk/manager.apk
            echo "::warning::No Manager APK fetched; the zip is built without it"
          fi

      - name: Setup (deps, toolchain, source, KernelSU-Next)
        run: bash scripts/01_setup.sh "$KSU_REF"

      - name: Build kernel
        run: |
          bash scripts/02_build.sh
          tail -n 3 "$WORK/build.log"
          grep -q 'BUILD_EXIT=0' "$WORK/build.log"

      - name: Show KernelSU-Next driver version
        run: |
          cd "$WORK/src/KernelSU"
          echo "Driver branch/ref: $KSU_REF  commit: $(git rev-parse --short HEAD)  describe: $(git describe --tags 2>/dev/null)"
          echo "Pinned driver version: tag=${KSU_VERSION_TAG_OVERRIDE:-none} code=${KSU_VERSION_OVERRIDE:-none}"
          grep -n "KernelSU-Next version\|KernelSU-Next tag" "$WORK/build.log" | head -4 || true
          grep -rn "KERNEL_SU_UAPI_VERSION" uapi/supercall.h kernel/uapi/supercall.h 2>/dev/null | head -2 || true
          echo "KSU_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Verify extra features are in the final .config
        run: bash scripts/04_extra_features.sh verify "$WORK/src" "${FEATURES:-bbr}"

      - name: Show errors if build failed
        if: failure()
        run: grep -n "error:\|Error " "$WORK/build.log" | head -40 || true

      - name: Package flashable zip
        run: |
          APK=""
          if [ "$BUNDLE_APK" = "true" ] && [ -f _apk/manager.apk ]; then
            APK="$PWD/_apk/manager.apk"
            echo "Manager APK will be bundled in the zip"
          else
            echo "Manager APK NOT bundled (bundle_apk=$BUNDLE_APK)"
          fi
          bash scripts/03_package.sh "$APK"

      # Userspace KernelSU modules (NOT part of the kernel): newest release zip of each.
      # A failed download only warns; it never fails the kernel build.
      - name: Fetch latest Play Integrity Fix + TrickyStore modules
        if: inputs.fetch_modules == 'true'
        run: |
          mkdir -p _mods
          get() {  # $1 = owner/repo   $2 = output name prefix
            URL=$(gh api "repos/$1/releases/latest" \
              --jq '[.assets[] | select(.name | test("\\.zip$")) | select(.name | test("debug|source";"i") | not)][0].browser_download_url // empty' || true)
            if [ -n "$URL" ] && curl -fsSL --retry 3 -o "_mods/$2-$(basename "$URL")" "$URL" && [ -s "_mods/$2-$(basename "$URL")" ]; then
              echo "Module $2: $URL"
            else
              echo "::warning::could not fetch module $2 from $1"
            fi
          }
          get osm0sis/PlayIntegrityFork PIF
          get 5ec1cff/TrickyStore TrickyStore
          ls -l _mods

      # Small KernelSU module: sets the boot-state props at boot so apps see a locked bootloader.
      # Props only (no hardware attestation). For Play Integrity still use PIF + TrickyStore + valid keybox.
      - name: Build Boot-State Spoof module
        if: inputs.boot_spoof_module == 'true'
        run: |
          mkdir -p _mods _bs
          cat > _bs/module.prop <<'EOF'
          id=t225_bootspoof
          name=T225 Boot State Spoof
          version=v1
          versionCode=1
          author=souvik
          description=Reports the bootloader as locked / verified boot green (props only). Use with PIF + TrickyStore for Play Integrity.
          EOF
          cat > _bs/post-fs-data.sh <<'EOF'
          #!/system/bin/sh
          RP=resetprop
          command -v resetprop >/dev/null 2>&1 || RP=/data/adb/ksu/bin/resetprop
          sp() { "$RP" -n "$1" "$2"; }
          sp ro.boot.verifiedbootstate green
          sp ro.boot.flash.locked 1
          sp ro.boot.vbmeta.device_state locked
          sp ro.boot.veritymode enforcing
          sp ro.boot.warranty_bit 0
          sp ro.warranty_bit 0
          sp ro.secure 1
          sp ro.debuggable 0
          EOF
          chmod 755 _bs/post-fs-data.sh
          (cd _bs && zip -qr ../_mods/T225-BootSpoof.zip .)
          ls -l _mods

      - name: Publish Release
        run: |
          ZIP=$(ls "$OUTDIR"/*.zip)
          MODS=$(ls _mods/*.zip _mods/*.apk 2>/dev/null || true)
          gh release create "build-${{ github.run_number }}" "$ZIP" $MODS \
            --title "T225 build #${{ github.run_number }} (KernelSU-Next: $KSU_REF, toolchain: $TOOLCHAIN)" \
            --notes "Auto-built flashable zip (toolchain: $TOOLCHAIN). If present, the attached Manager .apk (latest KowSU by default) is the app to install; the PIF/TrickyStore/BootSpoof zips are modules: install them in the KernelSU Manager (TrickyStore needs your own keybox.xml). Check after flashing: boots, WiFi/Bluetooth, overclock. Keep a known-good zip for TWRP."

      # Telegram: send the finished zip with build info. Never fails the build.
      # Needs repo secrets TG_BOT_TOKEN (from @BotFather) and TG_CHAT_ID.
      # Bot API limit: 50 MB per file, caption max 1024 chars.
      - name: Send zip to Telegram
        if: success() && inputs.send_telegram == 'true'
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "::warning::TG_BOT_TOKEN / TG_CHAT_ID secret not set; skipping Telegram"
            exit 0
          fi
          ZIP=$(ls "$OUTDIR"/*.zip | head -1)
          NAME=$(basename "$ZIP")
          SIZE=$(du -h "$ZIP" | cut -f1)
          MD5=$(md5sum "$ZIP" | cut -d' ' -f1)
          SHA=$(sha256sum "$ZIP" | cut -d' ' -f1)
          ELAPSED=$(( $(date +%s) - BUILD_START ))
          TIME="$((ELAPSED/60))m $((ELAPSED%60))s"
          CC=$("$WORK/toolchain_611/bin/clang" --version 2>/dev/null | head -1 || true)
          [ -z "$CC" ] && CC="$TOOLCHAIN"
          REL="https://github.com/${{ github.repository }}/releases/tag/build-${{ github.run_number }}"
          CAPTION=$(printf '%s\n' \
            "✅ T225 build #${{ github.run_number }} OK" \
            "KernelSU-Next: ${KSU_REF}@${KSU_COMMIT:-?}" \
            "Driver: ${KSU_VERSION_TAG_OVERRIDE:-own} (${KSU_VERSION_OVERRIDE:-own})" \
            "Compiler: ${CC}" \
            "Toolchain: ${TOOLCHAIN}" \
            "Features: ${FEATURES_ALL:-$FEATURES}" \
            "Manager: ${MANAGER_NAME:-none}" \
            "APK bundled: ${BUNDLE_APK}" \
            "Size: ${SIZE} | Time: ${TIME}" \
            "MD5: ${MD5}" \
            "SHA256: ${SHA}" \
            "Commit: $(git rev-parse --short HEAD)" \
            "${REL}")
          CAPTION="${CAPTION:0:1024}"
          curl -sS --retry 3 \
               -F chat_id="$TG_CHAT_ID" \
               -F document=@"$ZIP" \
               -F caption="$CAPTION" \
               "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument"
          echo

      - name: Notify Telegram on failure
        if: failure() && inputs.send_telegram == 'true'
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ] && exit 0
          curl -sS "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="$TG_CHAT_ID" \
            --data-urlencode "text=❌ T225 build #${{ github.run_number }} FAILED (toolchain: $TOOLCHAIN, ref: $KSU_REF)
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Keep build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: _work/build.log
