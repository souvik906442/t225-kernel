name: Unpack super.img from Drive

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: "Google Drive file ID of super.img"
        required: true
        default: "19ARmcgNhy_1f-iRIYU1DYY7ufV2LtC-H"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-24.04
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Install tools
        run: |
          pip install gdown --break-system-packages
          pip install git+https://github.com/unix3dgforce/lpunpack --break-system-packages

      - name: Download super.img from Drive
        run: |
          gdown "${{ inputs.drive_file_id }}" -O super.img
          ls -lh super.img

      - name: Unpack super.img
        run: |
          mkdir -p unpacked
          lpunpack super.img unpacked/
          ls -lh unpacked/

      - name: Upload unpacked partitions
        uses: actions/upload-artifact@v4
        with:
          name: super-unpacked
          path: unpacked/*
          retention-days: 7
